name: ecochronos-vault

services:
  api:
    build: .
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ecochronos}:${POSTGRES_PASSWORD:-ecochronos_local_dev}@postgres:5432/${POSTGRES_DB:-ecochronos}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ecochronos}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ecochronos_local_dev_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecochronos}
      MINIO_SECURE: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecochronos
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecochronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecochronos_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ecochronos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecochronos
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ecochronos}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ecochronos_local_dev_minio}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecochronos
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ecochronos}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ecochronos_local_dev_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecochronos}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks:
      - ecochronos
    restart: on-failure

networks:
  ecochronos:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
